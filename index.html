/* ---------------------------------- constants ---------------------------------- */

const FY_OPTIONS = ['2023-24', '2024-25', '2025-26', '2026-27', '2027-28'];

const PAN_RE = /^[A-Z]{5}[0-9]{4}[A-Z]$/;
const TAN_RE = /^[A-Z]{4}[0-9]{5}[A-Z]$/;

const uid = () => Math.random().toString(36).slice(2, 10);
const inr = (n) =>
  (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rateOf = (code) => SECTION_RATES_26Q.find((s) => s.code === code)?.rate ?? '';

const CHALLAN_EXTRACT_PROMPT = `You are extracting structured data from an Indian TDS challan / CIN receipt (OLTAS or e-Pay Tax, Challan No. ITNS 281). Look at the attached image or PDF and return ONLY a raw JSON object — no markdown fences, no explanation, no extra text. Use exactly these keys:
{
  "bsrCode": "7-digit BSR code as a string, empty string if not found",
  "date": "challan/tender date in YYYY-MM-DD format, empty string if not found",
  "challanSerialNo": "challan serial number as a string, empty string if not found",
  "section": "best-guess TDS section code such as 194C, 194J(b), 192 — empty string if not identifiable",
  "tdsAmount": 0,
  "interest": 0,
  "fee234E": 0,
  "others": 0
}
Numeric fields must be plain numbers (0 if not present on the receipt, not null).`;

const fileToBase64 = (file) =>
  new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

const toISODate = (v) => {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  const s = String(v).trim();
  const dmy = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (dmy) {
    let [, d, mo, y] = dmy;
    if (y.length === 2) y = (Number(y) < 50 ? '20' : '19') + y;
    return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) return s.slice(0, 10);
  return s;
};

const findCol = (rowObj, patterns) => {
  const keys = Object.keys(rowObj);
  for (const p of patterns) {
    const k = keys.find((k) => k.toLowerCase().replace(/[^a-z0-9]/g, '').includes(p));
    if (k) return k;
  }
  return null;
};

const mapSheetRowToDeductee = (row, is24Q) => {
  const g = (patterns) => {
    const k = findCol(row, patterns);
    return k ? row[k] : '';
  };
  if (is24Q) {
    return {
      pan: String(g(['pan'])).toUpperCase().trim(),
      name: String(g(['employeename', 'name'])).trim(),
      grossSalary: g(['grosssalary', 'salary', 'amount']) || '',
      tdsAmount: g(['tdsamount', 'tdsdeducted', 'tds']) || '',
      deductionDate: toISODate(g(['deductiondate', 'date'])),
      challanRef: String(g(['challan', 'challanref']) || '').trim(),
    };
  }
  return {
    pan: String(g(['pan'])).toUpperCase().trim(),
    name: String(g(['deducteename', 'partyname', 'vendorname', 'name'])).trim(),
    section: String(g(['section', 'sec']) || '').trim(),
    date: toISODate(g(['paymentdate', 'billdate', 'date'])),
    amountPaid: g(['amountpaid', 'grossamount', 'billamount', 'amount']) || '',
    rate: g(['tdsrate', 'rate']) || '',
    tdsAmount: g(['tdsamount', 'taxdeducted', 'tds']) || '',
    deductionDate: toISODate(g(['deductiondate'])),
    challanRef: String(g(['challan', 'challanref']) || '').trim(),
    depositDate: toISODate(g(['depositdate'])),
  };
};

const rowExtractPrompt = (is24Q) =>
  is24Q
    ? `You are extracting a table of employees and their salary TDS from a photo, scan, or PDF of a register/list. Return ONLY a raw JSON array (no markdown fences, no explanation). Each item must have exactly these keys:
{"pan": "10-char PAN or empty string", "name": "employee name", "grossSalary": 0, "tdsAmount": 0, "deductionDate": "YYYY-MM-DD or empty string"}
Numeric fields must be plain numbers (0 if unreadable). Include one array item per employee row visible.`
    : `You are extracting a table of deductees and their TDS details from a photo, scan, or PDF of a register/list. Return ONLY a raw JSON array (no markdown fences, no explanation). Each item must have exactly these keys:
{"pan": "10-char PAN or empty string", "name": "deductee name", "section": "TDS section like 194C, 194J(b) or empty string", "date": "payment date YYYY-MM-DD or empty string", "amountPaid": 0, "rate": 0, "tdsAmount": 0}
Numeric fields must be plain numbers (0 if unreadable). Include one array item per deductee row visible.`;

const emptyDeductor = {
  tan: '', pan: '', name: '', address: '', city: '', state: '', pincode: '',
  contactPerson: '', email: '', mobile: '',
};

/* ------------------------------- storage helpers ------------------------------- */

async function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error('storage save failed', e);
    return false;
  }
}

/* ------------------------------------ app -------------------------------------- */

function TDSReturnsManager() {
  const [deductor, setDeductor] = useState(emptyDeductor);
  const [apiKey, setApiKey] = useState('');
  const [fy, setFy] = useState('2026-27');
  const [quarter, setQuarter] = useState('Q1');
  const [form, setForm] = useState('26Q');
  const [challans, setChallans] = useState([]);
  const [rows, setRows] = useState([]); // deductees (26Q) or employees (24Q)
  const [tab, setTab] = useState('deductor');
  const [status, setStatus] = useState('idle'); // idle | loading | saving | saved
  const [ready, setReady] = useState(false);

  const periodKey = `period:${fy}:${quarter}:${form}`;
  const skipSave = useRef(true);

  // load deductor profile + api key once
  useEffect(() => {
    (async () => {
      const d = await loadJSON('deductor-profile', emptyDeductor);
      setDeductor(d);
      const k = localStorage.getItem('anthropic-api-key') || '';
      setApiKey(k);
    })();
  }, []);

  // load period data whenever fy/quarter/form changes
  useEffect(() => {
    setReady(false);
    skipSave.current = true;
    setStatus('loading');
    (async () => {
      const data = await loadJSON(periodKey, { challans: [], rows: [] });
      setChallans(data.challans || []);
      setRows(data.rows || []);
      setStatus('idle');
      setReady(true);
      // allow saves after this tick
      setTimeout(() => { skipSave.current = false; }, 0);
    })();
  }, [periodKey]);

  // debounced autosave of period data
  useEffect(() => {
    if (!ready || skipSave.current) return;
    setStatus('saving');
    const t = setTimeout(async () => {
      await saveJSON(periodKey, { challans, rows });
      setStatus('saved');
    }, 500);
    return () => clearTimeout(t);
  }, [challans, rows, ready, periodKey]);

  // debounced autosave of deductor profile
  const firstDeductorLoad = useRef(true);
  useEffect(() => {
    if (firstDeductorLoad.current) { firstDeductorLoad.current = false; return; }
    const t = setTimeout(() => saveJSON('deductor-profile', deductor), 500);
    return () => clearTimeout(t);
  }, [deductor]);

  // persist api key to this browser only
  const firstKeyLoad = useRef(true);
  useEffect(() => {
    if (firstKeyLoad.current) { firstKeyLoad.current = false; return; }
    try {
      if (apiKey) localStorage.setItem('anthropic-api-key', apiKey);
      else localStorage.removeItem('anthropic-api-key');
    } catch (e) { /* ignore */ }
  }, [apiKey]);

  /* ------------------------------- derived figures ------------------------------ */

  const totals = useMemo(() => {
    const deposited = challans.reduce(
      (s, c) => s + (c.nil ? 0 : (Number(c.tdsAmount) || 0) + (Number(c.interest) || 0) + (Number(c.fee234E) || 0) + (Number(c.others) || 0)),
      0
    );
    const deducted = rows.reduce((s, r) => s + (Number(r.tdsAmount) || 0), 0);
    const diff = Math.round((deposited - deducted) * 100) / 100;
    return { deposited, deducted, diff };
  }, [challans, rows]);

  const sectionWise = useMemo(() => {
    if (form !== '26Q') return [];
    const map = {};
    rows.forEach((r) => {
      const key = r.section || '—';
      if (!map[key]) map[key] = { section: key, paid: 0, tds: 0, count: 0 };
      map[key].paid += Number(r.amountPaid) || 0;
      map[key].tds += Number(r.tdsAmount) || 0;
      map[key].count += 1;
    });
    return Object.values(map).sort((a, b) => b.tds - a.tds);
  }, [rows, form]);

  const panIssues = useMemo(
    () => rows.filter((r) => !r.pan || !PAN_RE.test(r.pan.toUpperCase())),
    [rows]
  );
  const unlinked = useMemo(() => rows.filter((r) => !r.challanRef), [rows]);
  const tanValid = TAN_RE.test((deductor.tan || '').toUpperCase());
  const panValid = PAN_RE.test((deductor.pan || '').toUpperCase());

  const stampState =
    challans.length === 0 && rows.length === 0
      ? 'pending'
      : totals.diff === 0 && totals.deposited > 0
      ? 'tallied'
      : 'mismatch';

  /* ---------------------------------- actions ------------------------------------ */

  const addChallan = (draft) => setChallans((c) => [...c, { id: uid(), ...draft }]);
  const updateChallan = (id, patch) =>
    setChallans((c) => c.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const removeChallan = (id) => setChallans((c) => c.filter((x) => x.id !== id));

  const addRow = (draft) => setRows((r) => [...r, { id: uid(), ...draft }]);
  const updateRow = (id, patch) =>
    setRows((r) => r.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  const removeRow = (id) => setRows((r) => r.filter((x) => x.id !== id));

  const resetPeriod = () => {
    if (!confirm(`Clear all challan and ${form === '24Q' ? 'employee' : 'deductee'} data for ${form} · ${fy} · ${quarter}? This cannot be undone.`)) return;
    setChallans([]);
    setRows([]);
  };

  const exportWorkbook = () => {
    const wb = XLSX.utils.book_new();

    const deductorSheet = XLSX.utils.aoa_to_sheet([
      ['Deductor Details', ''],
      ['TAN', deductor.tan],
      ['PAN', deductor.pan],
      ['Name', deductor.name],
      ['Address', deductor.address],
      ['City', deductor.city],
      ['State', deductor.state],
      ['Pincode', deductor.pincode],
      ['Responsible Person', deductor.contactPerson],
      ['Email', deductor.email],
      ['Mobile', deductor.mobile],
      [],
      ['Financial Year', fy],
      ['Quarter', quarter],
      ['Form', form],
    ]);
    XLSX.utils.book_append_sheet(wb, deductorSheet, 'Deductor');

    const challanHeader = ['Sr No', 'BSR Code', 'Challan Date', 'Challan Serial No', 'Section', 'TDS Amount', 'Interest', 'Fee 234E', 'Others', 'Total', 'Nil Challan'];
    const challanRows = challans.map((c, i) => [
      i + 1, c.bsrCode, c.date, c.challanSerialNo, c.section,
      c.nil ? 0 : Number(c.tdsAmount) || 0,
      c.nil ? 0 : Number(c.interest) || 0,
      c.nil ? 0 : Number(c.fee234E) || 0,
      c.nil ? 0 : Number(c.others) || 0,
      c.nil ? 0 : (Number(c.tdsAmount) || 0) + (Number(c.interest) || 0) + (Number(c.fee234E) || 0) + (Number(c.others) || 0),
      c.nil ? 'Yes' : 'No',
    ]);
    const challanSheet = XLSX.utils.aoa_to_sheet([challanHeader, ...challanRows]);
    XLSX.utils.book_append_sheet(wb, challanSheet, 'Challans');

    if (form === '26Q') {
      const header = ['Sr No', 'PAN', 'Deductee Name', 'Section', 'Date of Payment', 'Amount Paid/Credited', 'Rate %', 'TDS Amount', 'Date of Deduction', 'Challan Ref', 'Deposit Date'];
      const body = rows.map((r, i) => [
        i + 1, r.pan, r.name, r.section, r.date, Number(r.amountPaid) || 0, r.rate, Number(r.tdsAmount) || 0, r.deductionDate, r.challanRef, r.depositDate,
      ]);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header, ...body]), 'Deductees');
    } else {
      const header = ['Sr No', 'PAN', 'Employee Name', 'Gross Salary (Qtr)', 'TDS Deducted (Qtr)', 'Date of Deduction', 'Challan Ref'];
      const body = rows.map((r, i) => [
        i + 1, r.pan, r.name, Number(r.grossSalary) || 0, Number(r.tdsAmount) || 0, r.deductionDate, r.challanRef,
      ]);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([header, ...body]), 'Employees');
    }

    const summaryRows = [
      ['Summary & Reconciliation', ''],
      ['Total TDS Deposited (Challans)', totals.deposited.toFixed(2)],
      ['Total TDS Deducted (' + (form === '24Q' ? 'Employees' : 'Deductees') + ')', totals.deducted.toFixed(2)],
      ['Difference', totals.diff.toFixed(2)],
      ['Status', stampState.toUpperCase()],
      [],
    ];
    if (sectionWise.length) {
      summaryRows.push(['Section', 'Count', 'Amount Paid', 'TDS Amount']);
      sectionWise.forEach((s) => summaryRows.push([s.section, s.count, s.paid.toFixed(2), s.tds.toFixed(2)]));
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Summary');

    XLSX.writeFile(wb, `TDS_${form}_${fy}_${quarter}.xlsx`);
  };

  /* ------------------------------------- UI -------------------------------------- */

  const NAV = [
    { id: 'deductor', label: 'Deductor', icon: Building2 },
    { id: 'challans', label: 'Challans', icon: Landmark },
    { id: 'rows', label: form === '24Q' ? 'Employees' : 'Deductees', icon: Users },
    { id: 'summary', label: 'Summary', icon: Calculator },
    { id: 'export', label: 'Export', icon: Download },
  ];

  return (
    <div className="tds-app">
      <style>{`
        .tds-app {
          --bg: #F3F5F1;
          --surface: #FFFFFF;
          --ink: #1C2621;
          --ink-muted: #5C6B62;
          --ink-faint: #93A199;
          --accent: #234E42;
          --accent-hover: #17352B;
          --accent-soft: #E4ECE6;
          --rust: #A15C2B;
          --rust-soft: #F4E7DB;
          --error: #9B3B33;
          --error-soft: #F5E4E1;
          --border: #D9DED6;
          --stripe: #F0F2ED;
          font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
          background: var(--bg);
          color: var(--ink);
          min-height: 100%;
          border-radius: 8px;
          overflow: hidden;
        }
        .tds-app * { box-sizing: border-box; }
        .tds-serif { font-family: 'IBM Plex Serif', Georgia, serif; }
        .tds-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
        .tds-app input, .tds-app select {
          font-family: inherit; font-size: 13px; color: var(--ink);
          background: var(--surface); border: 1px solid var(--border); border-radius: 5px;
          padding: 6px 8px; width: 100%; outline: none; transition: border-color .15s;
        }
        .tds-app input:focus, .tds-app select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .tds-app input.bad { border-color: var(--error); background: var(--error-soft); }
        .tds-app table { border-collapse: collapse; width: 100%; font-size: 13px; }
        .tds-app th {
          text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
          color: var(--ink-muted); border-bottom: 1px solid var(--border); padding: 8px 10px; white-space: nowrap;
          background: var(--surface); position: sticky; top: 0;
        }
        .tds-app td { padding: 5px 8px; border-bottom: 1px solid var(--stripe); vertical-align: middle; }
        .tds-app tbody tr:hover { background: var(--stripe); }
        .tds-btn {
          display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
          padding: 7px 13px; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
          transition: background .15s, border-color .15s;
        }
        .tds-btn-primary { background: var(--accent); color: #fff; }
        .tds-btn-primary:hover { background: var(--accent-hover); }
        .tds-btn-ghost { background: transparent; color: var(--ink-muted); border-color: var(--border); }
        .tds-btn-ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
        .tds-btn-danger { background: transparent; color: var(--error); }
        .tds-btn-danger:hover { background: var(--error-soft); }
        .tds-navitem {
          display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 6px; cursor: pointer;
          font-size: 13px; font-weight: 500; color: var(--ink-muted); border: 1px solid transparent;
        }
        .tds-navitem:hover { background: var(--surface); color: var(--ink); }
        .tds-navitem.active { background: var(--accent-soft); color: var(--accent); }
        .stamp {
          border: 2.5px solid; border-radius: 10px; padding: 10px 18px; font-family: 'IBM Plex Mono', monospace;
          font-weight: 700; letter-spacing: .12em; font-size: 13px; transform: rotate(-3deg); display: inline-flex;
          align-items: center; gap: 8px; text-transform: uppercase;
        }
        .stamp.tallied { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
        .stamp.mismatch { color: var(--error); border-color: var(--error); background: var(--error-soft); }
        .stamp.pending { color: var(--ink-faint); border-color: var(--ink-faint); background: var(--stripe); }
        .tds-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
        .tds-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .tds-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
      `}</style>

      {/* header */}
      <div style={{ borderBottom: '1px solid var(--border)', background: 'var(--surface)', padding: '16px 24px' }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: '.12em', textTransform: 'uppercase', color: 'var(--ink-faint)', marginBottom: 2 }}>
              Statutory Compliance Workspace
            </div>
            <div className="tds-serif" style={{ fontSize: 22, fontWeight: 600 }}>
              TDS Return Register {deductor.name ? `· ${deductor.name}` : ''}
            </div>
          </div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', fontSize: 12, color: 'var(--ink-muted)' }}>
            <span style={{
              width: 7, height: 7, borderRadius: 99,
              background: status === 'saving' ? 'var(--rust)' : status === 'loading' ? 'var(--ink-faint)' : 'var(--accent)',
              display: 'inline-block',
            }} />
            {status === 'saving' ? 'Saving…' : status === 'loading' ? 'Loading…' : 'Saved locally'}
          </div>
        </div>

        <div style={{ display: 'flex', gap: 10, marginTop: 14, flexWrap: 'wrap' }}>
          <select value={fy} onChange={(e) => setFy(e.target.value)} style={{ width: 110 }}>
            {FY_OPTIONS.map((f) => <option key={f} value={f}>FY {f}</option>)}
          </select>
          <select value={quarter} onChange={(e) => setQuarter(e.target.value)} style={{ width: 140 }}>
            {QUARTERS.map((q) => <option key={q.id} value={q.id}>{q.label}</option>)}
          </select>
          <div style={{ display: 'flex', border: '1px solid var(--border)', borderRadius: 6, overflow: 'hidden' }}>
            {FORMS.map((f) => (
              <button
                key={f.id}
                onClick={() => setForm(f.id)}
                style={{
                  padding: '6px 14px', fontSize: 13, fontWeight: 500, border: 'none', cursor: 'pointer',
                  background: form === f.id ? 'var(--accent)' : 'var(--surface)',
                  color: form === f.id ? '#fff' : 'var(--ink-muted)',
                }}
                title={f.sub}
              >
                {f.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* body */}
      <div style={{ display: 'flex', minHeight: 560 }}>
        {/* nav rail */}
        <div style={{ width: 190, borderRight: '1px solid var(--border)', padding: 14, display: 'flex', flexDirection: 'column', gap: 3, background: 'var(--bg)' }}>
          {NAV.map((n) => {
            const Icon = n.icon;
            return (
              <div key={n.id} className={`tds-navitem ${tab === n.id ? 'active' : ''}`} onClick={() => setTab(n.id)}>
                <Icon size={15} />
                {n.label}
                {n.id === 'summary' && stampState === 'mismatch' && (
                  <span style={{ marginLeft: 'auto', width: 6, height: 6, borderRadius: 99, background: 'var(--error)' }} />
                )}
              </div>
            );
          })}
          <div style={{ flex: 1 }} />
          <button className="tds-btn tds-btn-ghost" onClick={resetPeriod} style={{ justifyContent: 'center' }}>
            <RotateCcw size={13} /> Clear period
          </button>
        </div>

        {/* main panel — all tabs stay mounted, only visibility toggles, so an
            in-flight upload/extraction on one tab survives switching away and back */}
        <div style={{ flex: 1, padding: 24, overflow: 'auto' }}>
          <div style={{ display: tab === 'deductor' ? 'block' : 'none' }}>
            <DeductorPanel deductor={deductor} setDeductor={setDeductor} tanValid={tanValid} panValid={panValid} apiKey={apiKey} setApiKey={setApiKey} />
          </div>
          <div style={{ display: tab === 'challans' ? 'block' : 'none' }}>
            <ChallansPanel challans={challans} addChallan={addChallan} updateChallan={updateChallan} removeChallan={removeChallan} apiKey={apiKey} />
          </div>
          <div style={{ display: tab === 'rows' ? 'block' : 'none' }}>
            <RowsPanel form={form} rows={rows} challans={challans} addRow={addRow} updateRow={updateRow} removeRow={removeRow} apiKey={apiKey} />
          </div>
          <div style={{ display: tab === 'summary' ? 'block' : 'none' }}>
            <SummaryPanel
              form={form} totals={totals} sectionWise={sectionWise} panIssues={panIssues}
              unlinked={unlinked} stampState={stampState} tanValid={tanValid} panValid={panValid} deductor={deductor}
            />
          </div>
          <div style={{ display: tab === 'export' ? 'block' : 'none' }}>
            <ExportPanel exportWorkbook={exportWorkbook} form={form} fy={fy} quarter={quarter} rowCount={rows.length} challanCount={challans.length} />
          </div>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------ panels ------------------------------------ */

function Field({ label, children, error }) {
  return (
    <label style={{ display: 'block', marginBottom: 12 }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--ink-muted)', marginBottom: 4, textTransform: 'uppercase', letterSpacing: '.03em' }}>
        {label}
      </div>
      {children}
      {error && <div style={{ fontSize: 11, color: 'var(--error)', marginTop: 3 }}>{error}</div>}
    </label>
  );
}

function DeductorPanel({ deductor, setDeductor, tanValid, panValid, apiKey, setApiKey }) {
  const set = (k) => (e) => setDeductor((d) => ({ ...d, [k]: e.target.value }));
  return (
    <div style={{ maxWidth: 640 }}>
      <h2 className="tds-serif" style={{ fontSize: 18, marginBottom: 4 }}>Deductor details</h2>
      <p style={{ fontSize: 13, color: 'var(--ink-muted)', marginBottom: 18 }}>
        Saved once and shared across every FY, quarter, and form.
      </p>
      <div className="tds-card" style={{ padding: 20 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0 16px' }}>
          <Field label="TAN" error={deductor.tan && !tanValid ? 'Format: 4 letters, 5 digits, 1 letter (e.g. BLRA12345B)' : null}>
            <input className={deductor.tan && !tanValid ? 'bad' : ''} value={deductor.tan} onChange={(e) => setDeductor((d) => ({ ...d, tan: e.target.value.toUpperCase() }))} placeholder="BLRA12345B" maxLength={10} />
          </Field>
          <Field label="PAN of deductor" error={deductor.pan && !panValid ? 'Format: 5 letters, 4 digits, 1 letter' : null}>
            <input className={deductor.pan && !panValid ? 'bad' : ''} value={deductor.pan} onChange={(e) => setDeductor((d) => ({ ...d, pan: e.target.value.toUpperCase() }))} placeholder="AAAAA9999A" maxLength={10} />
          </Field>
        </div>
        <Field label="Deductor name"><input value={deductor.name} onChange={set('name')} placeholder="Company / entity name" /></Field>
        <Field label="Address"><input value={deductor.address} onChange={set('address')} /></Field>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 16px' }}>
          <Field label="City"><input value={deductor.city} onChange={set('city')} /></Field>
          <Field label="State"><input value={deductor.state} onChange={set('state')} /></Field>
          <Field label="Pincode"><input value={deductor.pincode} onChange={set('pincode')} maxLength={6} /></Field>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0 16px' }}>
          <Field label="Responsible person"><input value={deductor.contactPerson} onChange={set('contactPerson')} /></Field>
          <Field label="Email"><input value={deductor.email} onChange={set('email')} type="email" /></Field>
          <Field label="Mobile"><input value={deductor.mobile} onChange={set('mobile')} maxLength={10} /></Field>
        </div>
      </div>

      <h2 className="tds-serif" style={{ fontSize: 16, marginTop: 28, marginBottom: 4 }}>AI-powered import (optional)</h2>
      <p style={{ fontSize: 13, color: 'var(--ink-muted)', marginBottom: 12 }}>
        Powers the "upload a receipt / scan" import buttons on the Challans and Deductees tabs.
      </p>
      <div className="tds-card" style={{ padding: 20 }}>
        <Field label="Anthropic API key">
          <input
            type="password"
            value={apiKey}
            onChange={(e) => setApiKey(e.target.value.trim())}
            placeholder="sk-ant-..."
            autoComplete="off"
          />
        </Field>
        <div style={{ display: 'flex', gap: 10, fontSize: 12.5, color: 'var(--ink-muted)', lineHeight: 1.6, marginTop: 4 }}>
          <Info size={16} style={{ flexShrink: 0, marginTop: 1 }} color="var(--rust)" />
          <div>
            Stored only in this browser's local storage and sent directly from your browser to Anthropic's API —
            never to any other server. Get a key at <span className="tds-mono">console.anthropic.com</span>.
            Because this is a client-side page, anyone with access to this browser or its dev tools could read the
            key back out, so avoid pasting a key here on a shared or public computer, and leave the field blank if
            you'd rather skip the AI-import features entirely.
          </div>
        </div>
      </div>
    </div>
  );
}

function ChallansPanel({ challans, addChallan, updateChallan, removeChallan, apiKey }) {
  const [draft, setDraft] = useState({ bsrCode: '', date: '', challanSerialNo: '', section: '', tdsAmount: '', interest: '', fee234E: '', others: '', nil: false });
  const canAdd = draft.bsrCode && draft.date && draft.challanSerialNo;

  const submit = () => {
    if (!canAdd) return;
    addChallan(draft);
    setDraft({ bsrCode: '', date: '', challanSerialNo: '', section: '', tdsAmount: '', interest: '', fee234E: '', others: '', nil: false });
  };

  const [staged, setStaged] = useState([]);
  const [importing, setImporting] = useState(false);
  const [importErrors, setImportErrors] = useState([]);

  const patchStaged = (id, patch) => setStaged((arr) => arr.map((x) => (x.id === id ? { ...x, ...patch } : x)));

  const handleFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (!apiKey) {
      setImportErrors(['Add an Anthropic API key in the Deductor tab to enable receipt import.']);
      return;
    }
    setImporting(true);
    setImportErrors([]);
    for (const file of files) {
      try {
        const base64 = await fileToBase64(file);
        const isPdf = file.type === 'application/pdf';
        const contentBlock = isPdf
          ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } }
          : { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: base64 } };

        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-5',
            max_tokens: 1000,
            messages: [{ role: 'user', content: [contentBlock, { type: 'text', text: CHALLAN_EXTRACT_PROMPT }] }],
          }),
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'API error');
        const text = (data.content || []).map((b) => b.text || '').join('\n');
        const clean = text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(clean);
        setStaged((s) => [
          ...s,
          {
            id: uid(),
            sourceFile: file.name,
            nil: false,
            bsrCode: parsed.bsrCode || '',
            date: parsed.date || '',
            challanSerialNo: parsed.challanSerialNo || '',
            section: parsed.section || '',
            tdsAmount: parsed.tdsAmount ?? '',
            interest: parsed.interest ?? '',
            fee234E: parsed.fee234E ?? '',
            others: parsed.others ?? '',
          },
        ]);
      } catch (e) {
        setImportErrors((errs) => [...errs, `Couldn't read "${file.name}" — ${e.message || 'add it manually instead.'}`]);
      }
    }
    setImporting(false);
  };

  return (
    <div>
      <h2 className="tds-serif" style={{ fontSize: 18, marginBottom: 4 }}>Challans</h2>
      <p style={{ fontSize: 13, color: 'var(--ink-muted)', marginBottom: 16 }}>
        Every challan through which TDS was deposited with the bank this quarter.
      </p>

      <div className="tds-card" style={{ padding: 16, marginBottom: 16, borderStyle: 'dashed', borderWidth: 1.5 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
            <UploadCloud size={18} color="var(--accent)" style={{ marginTop: 2, flexShrink: 0 }} />
            <div>
              <div style={{ fontSize: 13, fontWeight: 600 }}>Import from challan receipts</div>
              <div style={{ fontSize: 12, color: 'var(--ink-muted)' }}>
                Upload a PDF or photo of a challan / CIN receipt — the fields below are read automatically.
              </div>
            </div>
          </div>
          <label className="tds-btn tds-btn-primary" style={{ cursor: importing ? 'default' : 'pointer', opacity: importing ? 0.6 : 1 }}>
            <UploadCloud size={13} /> {importing ? 'Reading…' : apiKey ? 'Upload receipts' : 'Upload receipts (needs API key)'}
            <input
              type="file"
              accept="image/*,.pdf"
              multiple
              disabled={importing}
              style={{ display: 'none' }}
              onChange={(e) => { handleFiles(e.target.files); e.target.value = ''; }}
            />
          </label>
        </div>
        {importErrors.map((err, i) => (
          <div key={i} style={{ fontSize: 12, color: 'var(--error)', marginTop: 8 }}>{err}</div>
        ))}
      </div>

      {staged.length > 0 && (
        <div className="tds-card tds-scroll" style={{ overflow: 'auto', marginBottom: 16 }}>
          <div style={{ padding: '10px 16px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '.04em' }}>
              Extracted — review before adding ({staged.length})
            </span>
            <button
              className="tds-btn tds-btn-primary"
              onClick={() => { staged.forEach((s) => addChallan(s)); setStaged([]); }}
            >
              Add all
            </button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Source</th><th>BSR code</th><th>Date</th><th>Serial no.</th><th>Section</th>
                <th>TDS ₹</th><th>Interest ₹</th><th>Fee 234E ₹</th><th>Others ₹</th><th></th>
              </tr>
            </thead>
            <tbody>
              {staged.map((s) => (
                <tr key={s.id}>
                  <td style={{ fontSize: 11, color: 'var(--ink-faint)', maxWidth: 110, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={s.sourceFile}>
                    {s.sourceFile}
                  </td>
                  <td><input value={s.bsrCode} onChange={(e) => patchStaged(s.id, { bsrCode: e.target.value })} style={{ width: 90 }} /></td>
                  <td><input type="date" value={s.date} onChange={(e) => patchStaged(s.id, { date: e.target.value })} style={{ width: 135 }} /></td>
                  <td><input value={s.challanSerialNo} onChange={(e) => patchStaged(s.id, { challanSerialNo: e.target.value })} style={{ width: 80 }} /></td>
                  <td><input value={s.section} onChange={(e) => patchStaged(s.id, { section: e.target.value })} style={{ width: 90 }} /></td>
                  <td><input className="tds-mono" value={s.tdsAmount} onChange={(e) => patchStaged(s.id, { tdsAmount: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input className="tds-mono" value={s.interest} onChange={(e) => patchStaged(s.id, { interest: e.target.value })} style={{ width: 80, textAlign: 'right' }} /></td>
                  <td><input className="tds-mono" value={s.fee234E} onChange={(e) => patchStaged(s.id, { fee234E: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input className="tds-mono" value={s.others} onChange={(e) => patchStaged(s.id, { others: e.target.value })} style={{ width: 80, textAlign: 'right' }} /></td>
                  <td style={{ display: 'flex', gap: 4 }}>
                    <button className="tds-btn tds-btn-primary" onClick={() => { addChallan(s); setStaged((arr) => arr.filter((x) => x.id !== s.id)); }}><Plus size={12} /></button>
                    <button className="tds-btn tds-btn-danger" onClick={() => setStaged((arr) => arr.filter((x) => x.id !== s.id))}><Trash2 size={12} /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ padding: '8px 16px', fontSize: 11.5, color: 'var(--ink-faint)' }}>
            Double-check figures against the original receipt before filing — extraction can misread poor-quality scans.
          </div>
        </div>
      )}

      <div className="tds-card tds-scroll" style={{ overflow: 'auto' }}>
        <table>
          <thead>
            <tr>
              <th>#</th><th>BSR code</th><th>Date</th><th>Serial no.</th><th>Section</th>
              <th>TDS ₹</th><th>Interest ₹</th><th>Fee 234E ₹</th><th>Others ₹</th><th>Total ₹</th><th>Nil</th><th></th>
            </tr>
          </thead>
          <tbody>
            {challans.map((c, i) => {
              const total = c.nil ? 0 : (Number(c.tdsAmount) || 0) + (Number(c.interest) || 0) + (Number(c.fee234E) || 0) + (Number(c.others) || 0);
              return (
                <tr key={c.id}>
                  <td className="tds-mono">{i + 1}</td>
                  <td><input value={c.bsrCode} onChange={(e) => updateChallan(c.id, { bsrCode: e.target.value })} style={{ width: 90 }} /></td>
                  <td><input type="date" value={c.date} onChange={(e) => updateChallan(c.id, { date: e.target.value })} style={{ width: 135 }} /></td>
                  <td><input value={c.challanSerialNo} onChange={(e) => updateChallan(c.id, { challanSerialNo: e.target.value })} style={{ width: 80 }} /></td>
                  <td>
                    <select value={c.section} onChange={(e) => updateChallan(c.id, { section: e.target.value })} style={{ width: 100 }}>
                      <option value="">—</option>
                      <option value="192">192</option>
                      {SECTION_RATES_26Q.map((s) => <option key={s.code} value={s.code}>{s.code}</option>)}
                    </select>
                  </td>
                  <td><input className="tds-mono" disabled={c.nil} value={c.tdsAmount} onChange={(e) => updateChallan(c.id, { tdsAmount: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input className="tds-mono" disabled={c.nil} value={c.interest} onChange={(e) => updateChallan(c.id, { interest: e.target.value })} style={{ width: 80, textAlign: 'right' }} /></td>
                  <td><input className="tds-mono" disabled={c.nil} value={c.fee234E} onChange={(e) => updateChallan(c.id, { fee234E: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                  <td><input className="tds-mono" disabled={c.nil} value={c.others} onChange={(e) => updateChallan(c.id, { others: e.target.value })} style={{ width: 80, textAlign: 'right' }} /></td>
                  <td className="tds-mono" style={{ fontWeight: 600, textAlign: 'right' }}>{inr(total)}</td>
                  <td style={{ textAlign: 'center' }}><input type="checkbox" checked={!!c.nil} onChange={(e) => updateChallan(c.id, { nil: e.target.checked })} /></td>
                  <td><button className="tds-btn tds-btn-danger" onClick={() => removeChallan(c.id)}><Trash2 size={13} /></button></td>
                </tr>
              );
            })}
            <tr>
              <td className="tds-mono" style={{ color: 'var(--ink-faint)' }}>+</td>
              <td><input value={draft.bsrCode} onChange={(e) => setDraft({ ...draft, bsrCode: e.target.value })} placeholder="7-digit BSR" style={{ width: 90 }} /></td>
              <td><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} style={{ width: 135 }} /></td>
              <td><input value={draft.challanSerialNo} onChange={(e) => setDraft({ ...draft, challanSerialNo: e.target.value })} placeholder="00001" style={{ width: 80 }} /></td>
              <td>
                <select value={draft.section} onChange={(e) => setDraft({ ...draft, section: e.target.value })} style={{ width: 100 }}>
                  <option value="">—</option>
                  <option value="192">192</option>
                  {SECTION_RATES_26Q.map((s) => <option key={s.code} value={s.code}>{s.code}</option>)}
                </select>
              </td>
              <td><input className="tds-mono" disabled={draft.nil} value={draft.tdsAmount} onChange={(e) => setDraft({ ...draft, tdsAmount: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
              <td><input className="tds-mono" disabled={draft.nil} value={draft.interest} onChange={(e) => setDraft({ ...draft, interest: e.target.value })} style={{ width: 80, textAlign: 'right' }} /></td>
              <td><input className="tds-mono" disabled={draft.nil} value={draft.fee234E} onChange={(e) => setDraft({ ...draft, fee234E: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
              <td><input className="tds-mono" disabled={draft.nil} value={draft.others} onChange={(e) => setDraft({ ...draft, others: e.target.value })} style={{ width: 80, textAlign: 'right' }} /></td>
              <td></td>
              <td style={{ textAlign: 'center' }}><input type="checkbox" checked={draft.nil} onChange={(e) => setDraft({ ...draft, nil: e.target.checked })} /></td>
              <td><button className="tds-btn tds-btn-primary" disabled={!canAdd} onClick={submit} style={{ opacity: canAdd ? 1 : 0.4 }}><Plus size={13} /></button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function RowsPanel({ form, rows, challans, addRow, updateRow, removeRow, apiKey }) {
  const is24Q = form === '24Q';
  const [draft, setDraft] = useState(
    is24Q
      ? { pan: '', name: '', grossSalary: '', tdsAmount: '', deductionDate: '', challanRef: '' }
      : { pan: '', name: '', section: '', date: '', amountPaid: '', rate: '', tdsAmount: '', deductionDate: '', challanRef: '', depositDate: '' }
  );

  const resetDraft = () =>
    setDraft(
      is24Q
        ? { pan: '', name: '', grossSalary: '', tdsAmount: '', deductionDate: '', challanRef: '' }
        : { pan: '', name: '', section: '', date: '', amountPaid: '', rate: '', tdsAmount: '', deductionDate: '', challanRef: '', depositDate: '' }
    );

  const canAdd = draft.pan && draft.name;
  const submit = () => { if (!canAdd) return; addRow(draft); resetDraft(); };

  const onSectionChange = (val, setter) => {
    const r = rateOf(val);
    setter((d) => ({ ...d, section: val, rate: r === '' ? d.rate : r }));
  };

  const [staged, setStaged] = useState([]);
  const [importing, setImporting] = useState(false);
  const [importErrors, setImportErrors] = useState([]);
  const patchStaged = (id, patch) => setStaged((arr) => arr.map((x) => (x.id === id ? { ...x, ...patch } : x)));

  const handleSheetFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setImporting(true);
    setImportErrors([]);
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(ws, { defval: '' });
        if (!json.length) throw new Error('empty sheet');
        const mapped = json.map((row) => ({ id: uid(), sourceFile: file.name, ...mapSheetRowToDeductee(row, is24Q) }));
        setStaged((s) => [...s, ...mapped]);
      } catch (e) {
        setImportErrors((errs) => [...errs, `Couldn't read "${file.name}" as a spreadsheet — check it has a header row.`]);
      }
    }
    setImporting(false);
  };

  const handlePhotoFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (!apiKey) {
      setImportErrors(['Add an Anthropic API key in the Deductor tab to enable photo/scan import.']);
      return;
    }
    setImporting(true);
    setImportErrors([]);
    for (const file of files) {
      try {
        const base64 = await fileToBase64(file);
        const isPdf = file.type === 'application/pdf';
        const contentBlock = isPdf
          ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } }
          : { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: base64 } };
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-5',
            max_tokens: 2000,
            messages: [{ role: 'user', content: [contentBlock, { type: 'text', text: rowExtractPrompt(is24Q) }] }],
          }),
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'API error');
        const text = (data.content || []).map((b) => b.text || '').join('\n');
        const clean = text.replace(/```json|```/g, '').trim();
        const parsedArr = JSON.parse(clean);
        const mapped = (Array.isArray(parsedArr) ? parsedArr : [parsedArr]).map((p) => ({
          id: uid(),
          sourceFile: file.name,
          pan: (p.pan || '').toUpperCase(),
          name: p.name || '',
          section: p.section || '',
          date: p.date || '',
          amountPaid: p.amountPaid ?? '',
          rate: p.rate ?? '',
          grossSalary: p.grossSalary ?? '',
          tdsAmount: p.tdsAmount ?? '',
          deductionDate: p.deductionDate || '',
          challanRef: '',
          depositDate: '',
        }));
        setStaged((s) => [...s, ...mapped]);
      } catch (e) {
        setImportErrors((errs) => [...errs, `Couldn't read "${file.name}" — ${e.message || 'add its rows manually instead.'}`]);
      }
    }
    setImporting(false);
  };

  return (
    <div>
      <h2 className="tds-serif" style={{ fontSize: 18, marginBottom: 4 }}>{is24Q ? 'Employees' : 'Deductees'}</h2>
      <p style={{ fontSize: 13, color: 'var(--ink-muted)', marginBottom: 16 }}>
        {is24Q ? 'Salary TDS by employee for this quarter.' : 'Payment and TDS detail by deductee, section-wise.'}
      </p>

      <div className="tds-card" style={{ padding: 16, marginBottom: 16, borderStyle: 'dashed', borderWidth: 1.5 }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
            <UploadCloud size={18} color="var(--accent)" style={{ marginTop: 2, flexShrink: 0 }} />
            <div>
              <div style={{ fontSize: 13, fontWeight: 600 }}>Import {is24Q ? 'employees' : 'deductees'} in bulk</div>
              <div style={{ fontSize: 12, color: 'var(--ink-muted)' }}>
                From a spreadsheet export, or a photo/scan of a written register.
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <label className="tds-btn tds-btn-ghost" style={{ cursor: importing ? 'default' : 'pointer', opacity: importing ? 0.6 : 1 }}>
              <UploadCloud size={13} /> {importing ? 'Reading…' : 'Spreadsheet (CSV/Excel)'}
              <input
                type="file"
                accept=".csv,.xlsx,.xls"
                multiple
                disabled={importing}
                style={{ display: 'none' }}
                onChange={(e) => { handleSheetFiles(e.target.files); e.target.value = ''; }}
              />
            </label>
            <label className="tds-btn tds-btn-primary" style={{ cursor: importing ? 'default' : 'pointer', opacity: importing ? 0.6 : 1 }}>
              <UploadCloud size={13} /> {importing ? 'Reading…' : apiKey ? 'Photo / scan' : 'Photo / scan (needs API key)'}
              <input
                type="file"
                accept="image/*,.pdf"
                multiple
                disabled={importing}
                style={{ display: 'none' }}
                onChange={(e) => { handlePhotoFiles(e.target.files); e.target.value = ''; }}
              />
            </label>
          </div>
        </div>
        {importErrors.map((err, i) => (
          <div key={i} style={{ fontSize: 12, color: 'var(--error)', marginTop: 8 }}>{err}</div>
        ))}
      </div>

      {staged.length > 0 && (
        <div className="tds-card tds-scroll" style={{ overflow: 'auto', marginBottom: 16 }}>
          <div style={{ padding: '10px 16px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '.04em' }}>
              Extracted — review before adding ({staged.length})
            </span>
            <button className="tds-btn tds-btn-primary" onClick={() => { staged.forEach((s) => addRow(s)); setStaged([]); }}>Add all</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Source</th><th>PAN</th><th>Name</th>
                {is24Q ? <th>Gross salary ₹</th> : <><th>Section</th><th>Payment date</th><th>Amount ₹</th><th>Rate %</th></>}
                <th>TDS ₹</th><th></th>
              </tr>
            </thead>
            <tbody>
              {staged.map((s) => {
                const panBad = !s.pan || !PAN_RE.test(s.pan.toUpperCase());
                return (
                  <tr key={s.id}>
                    <td style={{ fontSize: 11, color: 'var(--ink-faint)', maxWidth: 90, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={s.sourceFile}>{s.sourceFile}</td>
                    <td><input className={panBad ? 'bad' : ''} value={s.pan} onChange={(e) => patchStaged(s.id, { pan: e.target.value.toUpperCase() })} style={{ width: 100 }} /></td>
                    <td><input value={s.name} onChange={(e) => patchStaged(s.id, { name: e.target.value })} style={{ width: 130 }} /></td>
                    {is24Q ? (
                      <td><input className="tds-mono" value={s.grossSalary} onChange={(e) => patchStaged(s.id, { grossSalary: e.target.value })} style={{ width: 95, textAlign: 'right' }} /></td>
                    ) : (
                      <>
                        <td><input value={s.section} onChange={(e) => patchStaged(s.id, { section: e.target.value })} style={{ width: 85 }} /></td>
                        <td><input type="date" value={s.date} onChange={(e) => patchStaged(s.id, { date: e.target.value })} style={{ width: 130 }} /></td>
                        <td><input className="tds-mono" value={s.amountPaid} onChange={(e) => patchStaged(s.id, { amountPaid: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
                        <td><input className="tds-mono" value={s.rate} onChange={(e) => patchStaged(s.id, { rate: e.target.value })} style={{ width: 50, textAlign: 'right' }} /></td>
                      </>
                    )}
                    <td><input className="tds-mono" value={s.tdsAmount} onChange={(e) => patchStaged(s.id, { tdsAmount: e.target.value })} style={{ width: 85, textAlign: 'right' }} /></td>
                    <td style={{ display: 'flex', gap: 4 }}>
                      <button className="tds-btn tds-btn-primary" onClick={() => { addRow(s); setStaged((arr) => arr.filter((x) => x.id !== s.id)); }}><Plus size={12} /></button>
                      <button className="tds-btn tds-btn-danger" onClick={() => setStaged((arr) => arr.filter((x) => x.id !== s.id))}><Trash2 size={12} /></button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div style={{ padding: '8px 16px', fontSize: 11.5, color: 'var(--ink-faint)' }}>
            Check PAN, amounts, and section codes against the source before adding — auto-mapping and scans can misread.
          </div>
        </div>
      )}

      <div className="tds-card tds-scroll" style={{ overflow: 'auto' }}>
        <table>
          <thead>
            <tr>
              <th>#</th><th>PAN</th><th>Name</th>
              {is24Q ? <th>Gross salary ₹</th> : <><th>Section</th><th>Payment date</th><th>Amount ₹</th><th>Rate %</th></>}
              <th>TDS ₹</th><th>Deduction date</th><th>Challan ref</th><th></th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => {
              const panBad = !r.pan || !PAN_RE.test(r.pan.toUpperCase());
              return (
                <tr key={r.id}>
                  <td className="tds-mono">{i + 1}</td>
                  <td><input className={panBad ? 'bad' : ''} value={r.pan} onChange={(e) => updateRow(r.id, { pan: e.target.value.toUpperCase() })} style={{ width: 105 }} maxLength={10} /></td>
                  <td><input value={r.name} onChange={(e) => updateRow(r.id, { name: e.target.value })} style={{ width: 140 }} /></td>
                  {is24Q ? (
                    <td><input className="tds-mono" value={r.grossSalary} onChange={(e) => updateRow(r.id, { grossSalary: e.target.value })} style={{ width: 100, textAlign: 'right' }} /></td>
                  ) : (
                    <>
                      <td>
                        <select value={r.section} onChange={(e) => onSectionChange(e.target.value, (fn) => updateRow(r.id, fn(r)))} style={{ width: 100 }}>
                          <option value="">—</option>
                          {SECTION_RATES_26Q.map((s) => <option key={s.code} value={s.code}>{s.code}</option>)}
                        </select>
                      </td>
                      <td><input type="date" value={r.date} onChange={(e) => updateRow(r.id, { date: e.target.value })} style={{ width: 130 }} /></td>
                      <td><input className="tds-mono" value={r.amountPaid} onChange={(e) => updateRow(r.id, { amountPaid: e.target.value })} style={{ width: 95, textAlign: 'right' }} /></td>
                      <td><input className="tds-mono" value={r.rate} onChange={(e) => updateRow(r.id, { rate: e.target.value })} style={{ width: 55, textAlign: 'right' }} /></td>
                    </>
                  )}
                  <td><input className="tds-mono" value={r.tdsAmount} onChange={(e) => updateRow(r.id, { tdsAmount: e.target.value })} style={{ width: 90, textAlign: 'right', fontWeight: 600 }} /></td>
                  <td><input type="date" value={r.deductionDate} onChange={(e) => updateRow(r.id, { deductionDate: e.target.value })} style={{ width: 130 }} /></td>
                  <td>
                    <select value={r.challanRef} onChange={(e) => updateRow(r.id, { challanRef: e.target.value })} style={{ width: 110 }}>
                      <option value="">unlinked</option>
                      {challans.map((c, ci) => <option key={c.id} value={c.challanSerialNo || `#${ci + 1}`}>{c.challanSerialNo || `Challan ${ci + 1}`}</option>)}
                    </select>
                  </td>
                  <td><button className="tds-btn tds-btn-danger" onClick={() => removeRow(r.id)}><Trash2 size={13} /></button></td>
                </tr>
              );
            })}
            <tr>
              <td className="tds-mono" style={{ color: 'var(--ink-faint)' }}>+</td>
              <td><input value={draft.pan} onChange={(e) => setDraft({ ...draft, pan: e.target.value.toUpperCase() })} placeholder="PAN" style={{ width: 105 }} maxLength={10} /></td>
              <td><input value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} placeholder="Name" style={{ width: 140 }} /></td>
              {is24Q ? (
                <td><input className="tds-mono" value={draft.grossSalary} onChange={(e) => setDraft({ ...draft, grossSalary: e.target.value })} style={{ width: 100, textAlign: 'right' }} /></td>
              ) : (
                <>
                  <td>
                    <select value={draft.section} onChange={(e) => onSectionChange(e.target.value, setDraft)} style={{ width: 100 }}>
                      <option value="">—</option>
                      {SECTION_RATES_26Q.map((s) => <option key={s.code} value={s.code}>{s.code}</option>)}
                    </select>
                  </td>
                  <td><input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} style={{ width: 130 }} /></td>
                  <td><input className="tds-mono" value={draft.amountPaid} onChange={(e) => setDraft({ ...draft, amountPaid: e.target.value })} style={{ width: 95, textAlign: 'right' }} /></td>
                  <td><input className="tds-mono" value={draft.rate} onChange={(e) => setDraft({ ...draft, rate: e.target.value })} style={{ width: 55, textAlign: 'right' }} /></td>
                </>
              )}
              <td><input className="tds-mono" value={draft.tdsAmount} onChange={(e) => setDraft({ ...draft, tdsAmount: e.target.value })} style={{ width: 90, textAlign: 'right' }} /></td>
              <td><input type="date" value={draft.deductionDate} onChange={(e) => setDraft({ ...draft, deductionDate: e.target.value })} style={{ width: 130 }} /></td>
              <td>
                <select value={draft.challanRef} onChange={(e) => setDraft({ ...draft, challanRef: e.target.value })} style={{ width: 110 }}>
                  <option value="">unlinked</option>
                  {challans.map((c, ci) => <option key={c.id} value={c.challanSerialNo || `#${ci + 1}`}>{c.challanSerialNo || `Challan ${ci + 1}`}</option>)}
                </select>
              </td>
              <td><button className="tds-btn tds-btn-primary" disabled={!canAdd} onClick={submit} style={{ opacity: canAdd ? 1 : 0.4 }}><Plus size={13} /></button></td>
            </tr>
          </tbody>
        </table>
      </div>
      {!is24Q && (
        <p style={{ fontSize: 12, color: 'var(--ink-faint)', marginTop: 10, display: 'flex', gap: 6, alignItems: 'center' }}>
          <Info size={13} /> Rate auto-fills from the section reference table — edit it if a lower-deduction certificate applies.
        </p>
      )}
    </div>
  );
}

function StatCard({ label, value, tone }) {
  return (
    <div className="tds-card" style={{ padding: '14px 18px', flex: 1, minWidth: 160 }}>
      <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '.04em', color: 'var(--ink-muted)', marginBottom: 6 }}>{label}</div>
      <div className="tds-mono" style={{ fontSize: 20, fontWeight: 700, color: tone || 'var(--ink)' }}>₹ {inr(value)}</div>
    </div>
  );
}

function SummaryPanel({ form, totals, sectionWise, panIssues, unlinked, stampState, tanValid, panValid, deductor }) {
  const stampLabel = stampState === 'tallied' ? 'Tallied' : stampState === 'mismatch' ? 'Mismatch' : 'Pending data';
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 12, marginBottom: 18 }}>
        <div>
          <h2 className="tds-serif" style={{ fontSize: 18, marginBottom: 4 }}>Summary & reconciliation</h2>
          <p style={{ fontSize: 13, color: 'var(--ink-muted)' }}>Deposited vs deducted, and outstanding checks before filing.</p>
        </div>
        <div className={`stamp ${stampState}`}>
          <Stamp size={15} /> {stampLabel}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', marginBottom: 20 }}>
        <StatCard label="Deposited (challans)" value={totals.deposited} />
        <StatCard label={`Deducted (${form === '24Q' ? 'employees' : 'deductees'})`} value={totals.deducted} />
        <StatCard label="Difference" value={Math.abs(totals.diff)} tone={totals.diff === 0 ? 'var(--accent)' : 'var(--error)'} />
      </div>

      {sectionWise.length > 0 && (
        <div className="tds-card" style={{ marginBottom: 20, overflow: 'hidden' }}>
          <div style={{ padding: '10px 16px', borderBottom: '1px solid var(--border)', fontSize: 12, fontWeight: 600, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '.04em' }}>
            Section-wise breakup
          </div>
          <table>
            <thead><tr><th>Section</th><th>Deductees</th><th>Amount paid ₹</th><th>TDS ₹</th></tr></thead>
            <tbody>
              {sectionWise.map((s) => (
                <tr key={s.section}>
                  <td>{s.section}</td>
                  <td className="tds-mono">{s.count}</td>
                  <td className="tds-mono" style={{ textAlign: 'right' }}>{inr(s.paid)}</td>
                  <td className="tds-mono" style={{ textAlign: 'right' }}>{inr(s.tds)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="tds-card" style={{ padding: 16 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink-muted)', textTransform: 'uppercase', letterSpacing: '.04em', marginBottom: 10 }}>
          Pre-filing checks
        </div>
        <CheckRow ok={tanValid} okText="Deductor TAN is valid" badText="Deductor TAN is missing or malformed" />
        <CheckRow ok={panValid} okText="Deductor PAN is valid" badText="Deductor PAN is missing or malformed" />
        <CheckRow ok={panIssues.length === 0} okText="All PANs are valid" badText={`${panIssues.length} row${panIssues.length === 1 ? '' : 's'} with a missing or malformed PAN`} />
        <CheckRow ok={unlinked.length === 0} okText="Every row is linked to a challan" badText={`${unlinked.length} row${unlinked.length === 1 ? '' : 's'} not linked to any challan`} />
        <CheckRow ok={totals.diff === 0} okText="Deposited and deducted amounts tally" badText={`Deposited and deducted differ by ₹ ${inr(Math.abs(totals.diff))}`} />
      </div>
    </div>
  );
}

function CheckRow({ ok, okText, badText }) {
  const Icon = ok ? CheckCircle2 : AlertTriangle;
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center', padding: '6px 0', fontSize: 13, color: ok ? 'var(--ink)' : 'var(--error)' }}>
      <Icon size={15} color={ok ? 'var(--accent)' : 'var(--error)'} />
      {ok ? okText : badText}
    </div>
  );
}

function ExportPanel({ exportWorkbook, form, fy, quarter, rowCount, challanCount }) {
  return (
    <div style={{ maxWidth: 560 }}>
      <h2 className="tds-serif" style={{ fontSize: 18, marginBottom: 4 }}>Export</h2>
      <p style={{ fontSize: 13, color: 'var(--ink-muted)', marginBottom: 18 }}>
        Download a structured workbook for {form} · FY {fy} · {quarter} — {challanCount} challan{challanCount === 1 ? '' : 's'}, {rowCount} {form === '24Q' ? 'employee' : 'deductee'} row{rowCount === 1 ? '' : 's'}.
      </p>
      <button className="tds-btn tds-btn-primary" onClick={exportWorkbook}>
        <Download size={14} /> Download Excel workbook
      </button>
      <div className="tds-card" style={{ padding: 16, marginTop: 20, display: 'flex', gap: 10, fontSize: 12.5, color: 'var(--ink-muted)', lineHeight: 1.6 }}>
        <Info size={16} style={{ flexShrink: 0, marginTop: 1 }} color="var(--rust)" />
        <div>
          This workbook organizes and reconciles your data for filing — it is not the government e-filing file itself.
          To actually submit the return, import this data into NSDL's Return Preparation Utility (RPU), validate it
          with the File Validation Utility (FVU), and upload the resulting <span className="tds-mono">.fvu</span> file
          through TRACES / the TIN-FC portal.
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TDSReturnsManager />);
</script>
</body>
</html>
